<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chronolog · Error</title>
		<style>
			body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
				background: #fafaf9; font-family: system-ui, sans-serif; color: #1c1917; padding: 16px; }
			main { max-width: 28rem; background: #fff; border: 1px solid #e7e5e4; border-radius: 8px;
				padding: 32px; text-align: center; }
			p { color: #57534e; font-size: 14px; }
			a { display: inline-block; margin-top: 16px; background: #2563eb; color: #fff; padding: 8px 16px;
				border-radius: 6px; text-decoration: none; font-size: 14px; }
		</style>
	</head>
	<body>
		<main>
			<p>%sveltekit.status%</p>
			<h1>Something went wrong</h1>
			<p>Chronolog couldn’t load this page. Your saved entries and notes are not affected.</p>
			<a href="/">Back to Chronolog</a>
		</main>
	</body>
</html>
