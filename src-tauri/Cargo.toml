[package]
name = "chronolog"
version = "0.0.1"
description = "Time tracking & notes for consulting work"
authors = [""]
edition = "2021"

[lib]
name = "chronolog_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# iOS only: hand off-site links to Safari (src/window.rs). The desktop build does not link it.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-opener = "2"
