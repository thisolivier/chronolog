services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./vite.config.ts:/app/vite.config.ts
      - ./svelte.config.js:/app/svelte.config.js
    environment:
      DATABASE_URL: postgresql://chronolog:chronolog@postgres:5432/chronolog
      ENCRYPTION_KEY: dev-encryption-key-for-docker-stack-000
      BETTER_AUTH_SECRET: dev-auth-secret-for-docker-stack-0000
      BETTER_AUTH_URL: http://localhost:5173
      ALLOW_REGISTRATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chronolog

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronolog
      POSTGRES_PASSWORD: chronolog
      POSTGRES_DB: chronolog
    ports:
      # Loopback only (docs/ports.md); takes effect the next time the container is recreated.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronolog -d chronolog"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronolog

networks:
  chronolog:
    driver: bridge

volumes:
  postgres_data:
