services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chronolog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chronolog}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      ORIGIN: ${BETTER_AUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chronolog

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronolog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chronolog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronolog} -d ${POSTGRES_DB:-chronolog}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronolog

networks:
  chronolog:
    driver: bridge

volumes:
  postgres_data:
